<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta http-equiv="refresh" content="0; url=discogs-match-extension/dashboard.html">
  <script>
    window.location.replace("discogs-match-extension/dashboard.html" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .loader {
      width: 32px;
      height: 32px;
      border: 3px solid #222;
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a {
      color: #e50914;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
